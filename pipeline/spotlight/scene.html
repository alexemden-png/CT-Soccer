const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_e=new THREE.Euler(),_s=new THREE.Vector3(1,1,1),_p=new THREE.Vector3();
function confettiBurst(k){confData.forEach((d,i)=>{const drag=1-Math.exp(-k*1.4);const x=d.x+d.vx*drag/1.4,z=d.z+d.vz*drag/1.4;const y=Math.max(0.02,d.y+d.vy*drag/1.4-0.8*k*k-0.6*k);
  _p.set(x,y,z);_e.set(d.ph+k*d.sp,d.ph*2+k*d.sp*0.7,k*d.sp*0.5);_q.setFromEuler(_e);_m.compose(_p,_q,_s);confetti.setMatrixAt(i,_m);});confetti.instanceMatrix.needsUpdate=true;}
function confettiRain(t,cx,cz){confData.forEach((d,i)=>{const per=(d.ry0+0.5)/d.fall;const ph=((t*d.fall/ (d.ry0+0.5))+d.ph/6)%1;const y=d.ry0+0.5-ph*(d.ry0+0.5);
  _p.set(cx+d.rx*0.7+Math.sin(t*2+d.ph)*0.25,Math.max(0.02,y),cz+d.rz*0.6+Math.cos(t*1.7+d.ph)*0.2);_e.set(d.ph+t*d.sp,d.ph*2+t*d.sp*0.7,t*d.sp*0.5);_q.setFromEuler(_e);_m.compose(_p,_q,_s);confetti.setMatrixAt(i,_m);});confetti.instanceMatrix.needsUpdate=true;}

// ---------- trophy ----------
function makeTrophy(){
  const g=new THREE.Group();
  const gold=new THREE.MeshStandardMaterial({color:0xffc21a,metalness:0.45,roughness:0.3,emissive:0x5a3c00,emissiveIntensity:0.35});
  const dark=M(0x1d2b55,{flatShading:false,roughness:.6});
  const base=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.26,0.14,32),dark);base.position.y=0.07;g.add(base);
  const plinth=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.2,0.1,32),gold);plinth.position.y=0.19;g.add(plinth);
  const prof=[[0.0,0.24],[0.05,0.24],[0.05,0.42],[0.09,0.46],[0.07,0.5],[0.1,0.56],[0.2,0.66],[0.26,0.8],[0.28,0.95],[0.29,1.0],[0.27,1.0],[0.25,0.93],[0.2,0.78],[0.0,0.72]].map(([r,y])=>new THREE.Vector2(r,y));
  const cup=new THREE.Mesh(new THREE.LatheGeometry(prof,40),gold);g.add(cup);
  for(const s of[-1,1]){const h=new THREE.Mesh(new THREE.TorusGeometry(0.12,0.025,10,24,Math.PI*1.25),gold);h.position.set(0.27*s,0.82,0);h.rotation.z=s>0?-Math.PI*0.62:Math.PI*0.62+Math.PI;g.add(h);}
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  return g;
}
const trophyHand=makeTrophy();pitch.add(trophyHand);
const podium=new THREE.Group();{const p=box(1.5,0.9,1.5,M(0x0f1b3d,{flatShading:false,roughness:.5}));p.position.y=0.45;podium.add(p);
  const s=box(1.52,0.12,1.52,M(0xffd23f,{flatShading:false,roughness:.5}));s.position.y=0.78;podium.add(s);
  const tp=makeTrophy();tp.scale.setScalar(1.55);tp.position.y=0.9;podium.add(tp);podium.position.set(0,0,30);podium.visible=false;pitch.add(podium);}

// team for celebrations
const team=[[-2.3,30.6,HOME,1,0.35],[-1.15,30.1,HOME,3,0.15],[0,29.8,HOME,0,0],[1.15,30.1,HOME,2,-0.15],[2.3,30.6,HOME,4,-0.35]].map(([x,z,sh,sk,ry])=>{const p=makePerson(sh,0xffffff,skins[sk],0x1a1410);p.root.position.set(x,0,z);p.root.rotation.y=ry;pitch.add(p.root);return p;});
const keeper=makePerson(0xffd23f,0x111827,skins[2],0x111111);keeper.root.visible=false;pitch.add(keeper.root);
function showTeam(v){team.forEach(p=>p.root.visible=v);trophyHand.visible=v;}

function celebrate(t,cheerStart){
  team.forEach((p,i)=>{resetPose(p);const k=sm(cheerStart,cheerStart+0.35,t);
    if(i===2){ // lifts the trophy
      p.arms[0].rotation.z=2.75*k;p.arms[1].rotation.z=-2.75*k;
      p.body.position.y=0.05*Math.abs(Math.sin(t*5))*k;
    } else {
      const ph=t*7.5+i*1.3;const jump=Math.max(0,Math.sin(ph))*0.32*k;p.body.position.y=jump;
      const up=2.4+0.4*Math.sin(ph+1);p.arms[0].rotation.z=-up*k;p.arms[1].rotation.z=up*k*(i%2?1:0.6);
      p.legs[0].rotation.x=-0.3*Math.max(0,Math.sin(ph))*k;p.legs[1].rotation.x=0.3*Math.max(0,Math.sin(ph))*k;}
  });
  // trophy in the hands of the middle player
  const p=team[2];const k=sm(cheerStart,cheerStart+0.35,t);
  const y=lerp(1.0,2.08,k)+p.body.position.y;trophyHand.position.set(p.root.position.x,y,p.root.position.z+lerp(0.32,0.03,k));
  trophyHand.rotation.set(0,Math.sin(t*1.3)*0.25,Math.sin(t*5)*0.05*k);
}

// ---------- shots ----------
function shotTrophyHook(t){
  showTeam(true);podium.visible=false;keeper.root.visible=false;ball.visible=false;
  celebrate(t,0.15);
  confetti.visible=true;confettiRain(t,0,30.2);
  const k=easeInOut(clamp(t/B[1]));
  pcam.position.set(lerp(1.2,0.5,k),lerp(0.75,0.95,k),lerp(36.6,35.2,k));pcam.lookAt(0,2.3,30);
  nearNet.update(0,0,0);
}
function shotPodium(t){
  showTeam(false);podium.visible=true;keeper.root.visible=false;ball.visible=false;confetti.visible=true;confettiRain(t+3,0,30);
  const s=t-B[1];const a=0.55-0.42*s/(B[2]-B[1]);const r=6.8-0.5*easeInOut(clamp(s/(B[2]-B[1])));
  pcam.position.set(Math.sin(a)*r,1.7,30+Math.cos(a)*r);pcam.lookAt(0,2.55,30);
  nearNet.update(0,0,0);
}
function shotCalendarBg(t){ // blurred-ish stadium behind the calendar
  showTeam(false);podium.visible=true;keeper.root.visible=false;ball.visible=false;confetti.visible=false;
  const s=t-B[2];pcam.position.set(-9+0.6*s,5.5,22+0.3*s);pcam.lookAt(0,2.0,40);nearNet.update(0,0,0);
}
function shotTrophyWide(t){
  showTeam(true);podium.visible=false;keeper.root.visible=false;ball.visible=false;
  celebrate(t,B[3]-0.2);confetti.visible=true;confettiRain(t,0,30.2);
  const s=t-B[3];const k=easeInOut(clamp(s/(B[4]-B[3])));
  pcam.position.set(lerp(3.2,1.6,k),lerp(1.15,1.0,k),lerp(37.2,36.0,k));pcam.lookAt(0,1.3,30);
  nearNet.update(0,0,0);
}
function keeperDive(s,dvA,dvB,toX,ry){
  keeper.root.visible=true;resetPose(keeper);
  const dv=sm(dvA,dvB,s),fall=sm(dvB+0.2,dvB+0.6,s);
  keeper.root.position.set(lerp(0.4,toX,dv),lerp(0,0.95,dv)*(1-fall)+0.12*fall,52.0);
  keeper.root.rotation.set(0,Math.PI,lerp(0,1.25,dv)+0.25*fall);
  keeper.arms[0].rotation.z=-2.7*dv;keeper.arms[1].rotation.z=2.7*dv;keeper.legs[0].rotation.z=-0.3*dv;
}
function shotSave(t){ // NEWS hook: diving save
  showTeam(false);podium.visible=false;ball.visible=true;confetti.visible=false;
  const s=t;keeperDive(s,0.55,1.0,2.25);
  const k0=0.35,hit=1.0;let bx,by,bz;
  if(s<k0){bx=-0.6;by=ballR;bz=43.4;}
  else if(s<hit){const u=(s-k0)/(hit-k0);bx=lerp(-0.6,2.35,u);bz=lerp(43.4,51.75,u);by=lerp(ballR,1.95,u)+0.55*Math.sin(Math.PI*u);}
  else{const k=s-hit;bx=2.35+3.4*k;bz=51.75+1.6*k;by=1.95+5.2*k-4.9*k*k;}
  ball.position.set(bx,Math.max(ballR,by),bz);ball.rotation.set(s*9,s*1.5,0);
  nearNet.update(0,0,0);
  const sh=s>hit?Math.exp(-(s-hit)*7)*0.02:0;
  const pk=easeInOut(clamp(s/B[1]));
  pcam.position.set(lerp(-1.0,-0.6,pk)+Math.sin(s*50)*sh,1.25+Math.cos(s*43)*sh,lerp(40.2,41.2,pk));pcam.lookAt(1.1,1.5,52.0);
}
function shotNewsBg(t){
  showTeam(false);podium.visible=false;keeper.root.visible=false;ball.visible=true;confetti.visible=false;
  ball.position.set(0,ballR,40);
  const s=t-B[1];pcam.position.set(8-0.4*s,4.2,30+0.5*s);pcam.lookAt(0,1.5,48);nearNet.update(0,0,0);
}
function shotGoal(t){ // NEWS CTA: goal + confetti (as in the first promo)
  showTeam(false);podium.visible=false;ball.visible=true;
  const s=t-B[3];
  keeperDive(s,0.12,0.55,2.3);
  const hit=0.48;let bx,by,bz;
  if(s<hit){const u=s/hit;bx=lerp(-4.0,2.45,u);bz=lerp(45.3,54.3,u);by=lerp(0.45,1.85,u)+0.5*Math.sin(Math.PI*u);}
  else{const k=s-hit;const bulge=0.6*Math.exp(-k*4.2)*Math.cos(k*9);bx=2.45;bz=54.3+Math.max(0,bulge);
    const tFall=Math.max(0,k-0.1);by=Math.max(ballR,1.85-4.9*tFall*tFall);
    if(by<=ballR+1e-4){const kk=tFall-Math.sqrt((1.85-ballR)/4.9);bz=54.15+0.15*Math.exp(-kk*3);}}
  ball.position.set(bx,by,bz);ball.rotation.set(s*9,s*1.5,0);
  const amp=s<hit?0:0.62*Math.exp(-(s-hit)*4.2)*Math.cos((s-hit)*9);
  nearNet.update(2.45,1.85,Math.max(-0.15,amp));
  confetti.visible=s>hit;if(confetti.visible)confettiBurst(s-hit);
  const push=easeInOut(clamp(s/(B[4]-B[3])));const sh=s>hit?Math.exp(-(s-hit)*7)*0.025:0;
  pcam.position.set(-4.9+0.5*push+Math.sin(s*50)*sh,1.0+0.15*push+Math.cos(s*43)*sh,43.6+0.8*push);
  pcam.lookAt(1.2,2.75,53.6);
}

// ---------- overlay helpers ----------
function showWin(el,t,a,b,fade=0.3,rise=40){const o=sm(a,a+fade,t)*(1-sm(b-fade,b,t));el.style.opacity=o;el.style.transform=`translateY(${(1-sm(a,a+fade,t))*rise}px)`;return o;}
function pop(el,t,t0,dur=0.35){const u=clamp((t-t0)/dur);const s=u<=0?0.6:0.6+0.4*easeOutBack(u);el.style.opacity=u<=0?0:Math.min(1,u*2.5);el.style.transform=`scale(${s})`;}
function slideIn(el,t,t0,dx=0,dy=60,dur=0.4){const u=sm(t0,t0+dur,t);el.style.opacity=u;el.style.transform=`translate(${(1-u)*dx}px,${(1-u)*dy}px)`;}

// ---------- spotlight content from spec.json ----------
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const mark=s=>esc(s||'').replace(/\[([^\]]+)\]/g,'<span class="hl">$1</span>').replace(/\n/g,'<br>');
const S='stroke="#0f1b3d" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"';
const ICONS={
  calendar:`<svg viewBox="0 0 100 100" width="50" height="50"><rect x="16" y="22" width="68" height="62" rx="10" ${S}/><path d="M16 42 H84 M34 12 V30 M66 12 V30" ${S}/></svg>`,
  people:`<svg viewBox="0 0 100 100" width="50" height="50"><circle cx="36" cy="36" r="13" ${S}/><circle cx="68" cy="40" r="10" ${S}/><path d="M12 82 C14 62 58 62 60 82 M62 66 C72 60 88 64 90 80" ${S}/></svg>`,
  ball:`<svg viewBox="0 0 100 100" width="52" height="52"><circle cx="50" cy="50" r="38" ${S}/><polygon points="50,34 64,44 59,61 41,61 36,44" fill="#0f1b3d"/><path d="M50 34 V13 M64 44 L84 38 M59 61 L70 80 M41 61 L30 80 M36 44 L16 38" ${S}/></svg>`,

  trophy:`<svg viewBox="0 0 100 100" width="50" height="50"><path d="M32 14 H68 V36 A18 18 0 0 1 32 36 Z M32 22 H16 C16 38 26 44 34 44 M68 22 H84 C84 38 74 44 66 44 M50 54 V70 M34 86 H66 M40 70 H60 V86 H40 Z" ${S}/></svg>`,
  clipboard:`<svg viewBox="0 0 100 100" width="50" height="50"><rect x="20" y="18" width="60" height="70" rx="8" ${S}/><path d="M38 12 H62 V26 H38 Z M32 46 H68 M32 60 H68 M32 74 H54" ${S}/></svg>`,
  star:`<svg viewBox="0 0 100 100" width="52" height="52"><polygon points="50,12 61,38 89,40 67,58 74,86 50,71 26,86 33,58 11,40 39,38" ${S}/></svg>`,
  clock:`<svg viewBox="0 0 100 100" width="50" height="50"><circle cx="50" cy="50" r="36" ${S}/><path d="M50 28 V50 L66 60" ${S}/></svg>`,
  link:`<svg viewBox="0 0 100 100" width="50" height="50"><path d="M44 58 L58 44 M40 40 L52 28 A16 16 0 0 1 74 50 L62 62 M60 60 L48 72 A16 16 0 0 1 26 50 L38 38" ${S}/></svg>`,
  whistle:`<svg viewBox="0 0 100 100" width="52" height="52"><circle cx="40" cy="58" r="22" ${S}/><path d="M40 36 H86 V52 H60 M14 30 L26 40" ${S}/></svg>`,
  shield:`<svg viewBox="0 0 100 100" width="50" height="50"><path d="M50 12 L82 24 V48 C82 68 68 82 50 90 C32 82 18 68 18 48 V24 Z" ${S}/></svg>`,
  chart:`<svg viewBox="0 0 100 100" width="50" height="50"><path d="M16 84 H86 M28 72 V52 M46 72 V36 M64 72 V46 M82 72 V24" ${S}/></svg>`,
  dollar:`<svg viewBox="0 0 100 100" width="50" height="50"><path d="M50 12 V88 M68 28 C62 20 34 18 32 34 C30 52 70 46 68 64 C66 80 38 80 30 70" ${S}/></svg>`,
};
const CARD=CFG.card, ST=CFG.stat||null;
$('hookText').innerHTML=mark(CFG.hook);
$('headText').innerHTML=mark(CFG.head||'');
const col=CARD.color||'#1d4fd8';
$('stripe').style.background=col;$('badge').style.background=col;
$('kick').textContent=(CARD.kicker||'').toUpperCase();
$('ttl').textContent=CARD.title;$('sub').textContent=CARD.subtitle||'';
if(!CARD.subtitle)$('sub').style.display='none';
CARD.rows.forEach((r,i)=>{const d=document.createElement('div');d.className='srow';d.id='row'+i;
  d.innerHTML=`<div class="ic">${ICONS[r.icon]||ICONS.star}</div><div class="tx"><div class="lb">${esc(r.label)}</div><div class="vl">${esc(r.value)}</div></div>`;
  $('rows').appendChild(d);});
if(ST){$('statL').innerHTML=mark(ST.label);}
$('noteText').textContent=CFG.note||'';
$('cta').textContent=CFG.cta;

// shrink text until it fits in maxLines (layout is unaffected by opacity, so measuring works now)
function fit(el,max,min,maxLines){let s=max;el.style.fontSize=s+'px';
  const lines=()=>el.getBoundingClientRect().height/(parseFloat(getComputedStyle(el).lineHeight)||s*1.05);
  while(s>min&&lines()>maxLines+0.15){s-=2;el.style.fontSize=s+'px';}return s;}
fit($('hookText'),92,60,3);
fit($('headText'),76,50,2);
fit($('ttl'),64,40,2);
fit($('sub'),31,24,2);
document.querySelectorAll('.srow .vl').forEach(el=>fit(el,44,30,2));
fit($('statL'),52,34,3);
fit($('cta'),56,38,2);
// stack: card under the head plate, stat under the card, note under the stat (or the card)
const headBottom=$('hHead').offsetTop+$('hHead').offsetHeight;
const cardTop=Math.max(400,headBottom+46);$('spot').style.top=cardTop+'px';
let y=cardTop+$('spot').offsetHeight+44;
if(ST){$('stats').style.top=y+'px';y+=$('stats').offsetHeight+34;}
$('note1').style.top=Math.min(y,1640)+'px';
const LAYOUT={cardTop,cardBottom:cardTop+$('spot').offsetHeight,noteBottom:Math.min(y,1640)+$('note1').offsetHeight};
console.log('layout',JSON.stringify(LAYOUT));
window.LAYOUT=LAYOUT;
const statNum=ST&&/^\d+$/.test(String(ST.n))?parseInt(ST.n,10):null;
if(ST&&statNum===null)$('statN').textContent=ST.n;

// the stadium is dimmed behind the card, so it is drawn once there instead of every frame
let lastKey=null;
window.renderAt=function(t){
  // ---------- 3D ----------
  const mid=t>=B[1]+0.45&&t<B[3];
  if(mid){if(lastKey!=='mid'){shotNewsBg(B[1]+0.45);renderer.render(pitch,pcam);lastKey='mid';}}
  else{
    if(t<B[1])(CFG.hookShot==='trophy'?shotTrophyHook:shotSave)(t);
    else if(t<B[3])shotNewsBg(t);
    else (CFG.ctaShot==='trophy'?shotTrophyWide:shotGoal)(t);
    renderer.render(pitch,pcam);lastKey=t;
  }
  // ---------- overlays ----------
  const f1=t<B[1]?sm(B[1]-0.16,B[1]-0.01,t):1-sm(B[1],B[1]+0.3,t);$('flash').style.opacity=(t<B[1]-0.17||t>B[1]+0.35)?0:f1;
  const f2=t<B[3]?sm(B[3]-0.22,B[3]-0.02,t):1-sm(B[3],B[3]+0.28,t);$('flash2').style.opacity=(t<B[3]-0.25||t>B[3]+0.3)?0:f2;
  showWin($('hook'),t,0.1,B[1]-0.08,0.28,50);
  showWin($('brand'),t,B[1]+0.25,B[3]-0.15,0.3,-20);
  showWin($('endc'),t,B[3]+0.45,B[4]+1,0.35,50);
  const u=clamp((t-C.url)/0.4);$('url').style.transform=`scale(${u<=0?0.7:0.7+0.3*easeOutBack(u)})`;$('url').style.opacity=u<=0?0:Math.min(1,u*2.5);
  $('dim').style.opacity=0.62*sm(B[1]+0.05,B[1]+0.35,t)*(1-sm(B[3]-0.25,B[3]+0.1,t));
  showWin($('hHead'),t,B[1]+0.1,B[3]-0.05,0.3,30);
  const cIn=sm(B[1]+0.2,B[1]+0.6,t),cOut=sm(B[3]-0.3,B[3]-0.02,t);
  $('spot').style.opacity=cIn*(1-cOut);$('spot').style.transform=`translateY(${(1-cIn)*80-cOut*40}px)`;
  CARD.rows.forEach((r,i)=>{const t0=C['row'+i];const v=sm(t0-0.08,t0+0.3,t);const el=$('row'+i);el.style.opacity=v;el.style.transform=`translateX(${(1-v)*60}px)`;});
  if(ST){showWin($('stats'),t,C.stat-0.1,B[3]-0.05,0.3,40);
    if(statNum!==null){const k=easeOut(clamp((t-C.stat)/0.7));$('statN').textContent=String(Math.round(statNum*k));}}
  if(CFG.note)showWin($('note1'),t,C.note,B[3]-0.05,0.3,20);
};
window.READY=true;
