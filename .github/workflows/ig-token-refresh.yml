name: Instagram token refresh

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC; tokens last 60 days
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renew tokens
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          IG_TOKEN_CTSOCCERHUB: ${{ secrets.IG_TOKEN_CTSOCCERHUB }}
          IG_TOKEN_CLIPTHEORY67: ${{ secrets.IG_TOKEN_CLIPTHEORY67 }}
        run: bash poster/refresh_tokens.sh
